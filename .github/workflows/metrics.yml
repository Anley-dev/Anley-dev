name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
            - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Anley-dev
          template: classic
          # We removed 'metadata' and 'plugin_languages' to hide the language bar
          base: header, activity, community, repositories
          config_timezone: Africa/Addis_Ababa
          filename: github-metrics.svg

