# ============================================================
# Nginx Reverse Proxy Configuration for Hawassa Dispatch System
# Production TLS Termination, Rate Limiting, & Caching
# ============================================================

upstream hawassa_web {
    server 127.0.0.1:8080 fail_timeout=5s max_fails=3;
    keepalive 32;
}

upstream hawassa_tiles {
    server 127.0.0.1:8081 fail_timeout=5s max_fails=3;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name hawassa-dispatch.local _;

    # Redirect plain HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # Static assets caching
    location /static/ {
        alias /home/anley/dogo/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # TileServer GL proxy
    location /tiles/ {
        proxy_pass http://hawassa_tiles/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=25 nodelay;
        proxy_pass http://hawassa_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health check bypasses rate limiting
    location /api/health {
        proxy_pass http://hawassa_web/api/health;
        access_log off;
    }

    # Web App UI
    location / {
        proxy_pass http://hawassa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
